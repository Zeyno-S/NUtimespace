<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Random Occupation Generator</title>
        <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            background-image: url("https://image.slidesdocs.com/responsive-images/background/eerie-blackened-wall-with-distressed-grungy-texture-perfectly-sinister-for-your-design-needs-powerpoint-background_054b9e9661__960_540.jpg");
            background-size: cover;
        }
        .container1 {
            text-align: center;
            background: white;
            padding: 40px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .container2 {
            
            text-align: center;
            background: white;
            padding: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 10px;
            width: 300px;
        }
        h1 {
            color: #333;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }
        .container2 h1 {
            font-size: 1rem;
            margin: 0;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    
    <div class="container1">
        <h1 id="occupation">.</h1>
        <button id="occupationBtn" onclick="getRandomOccupation()">Get Another One (SIKE you can't)</button>
    </div>

    <div class="container2">
        <h1><a href="https://docs.google.com/forms/d/e/1FAIpQLSfUxXg3VtwAHcdH34ASmu5l86UxhyKfhRwRuN6pKMqP5MSKKw/viewform?usp=header">Fill out this form</a></h1>
    </div>

        <script>
        const occupations = [

            "Septic Tank Technician",
            "Astronaut", 
            "Sewer Inspector",
            "Toll Booth Collector",
            "Asbestos Abatement Worker",
            "SCP Caretaker", 
            "Animal Waste Removal Specialist",
            "Corporate Compliance Officer",
            "Night Shift Security Guard",
            "Factory Assembly Line Worker",
            "Video Game Playtester",
            "Asbestos Abatement Worker",
            "Debt Collector",
            "Medical Billing Clerk",
            "Grease Trap Cleaner",
            "Customer Service Phone Agent",
            "Slaughterhouse Worker",
            "Wildlife Documentary Filmmaker", 
            "Elevator Repair Apprentice",
            "Document Shredding Truck Driver",
            "Dishwasher",
            "Toenail Clipper Blade Sharpener",
            "Mortuary Assistant",
            "DMV Clerical Assistant",
            "Landfill Operator",
            "Commercial Diver",
            "Hotel Bed Inspector",  
            "Boiler Room Technician",
            "Roadkill Removal Officer",
            "Claims Adjuster",
            "Cardboard Box Flattening Technician",
            "Fish Gutter",
            "Parking Enforcement Officer",
            "Roofing Laborer in Summer",
            "Archive Digitization Clerk",
            "Pest Control but you ARE the pest",
            "Hazardous Waste Transporter",
            "Warehouse Order Picker",
            "Subway Track Sweeper",
            "Cold-Call Telemarketer",
            "Industrial Grease Cleaner",
            "Bridge Paint Scraper",

            "Crypt Cleaning Assistant",
            "Melt Shop Furnace Operator",

            "Lawn Care Fertilizer Applier",

        function getRandomOccupation() {
            const randomIndex = Math.floor(Math.random() * occupations.length);
            document.getElementById("occupation").innerText = occupations[randomIndex];
            
            document.getElementById("occupationBtn").disabled = true;
        }

        window.addEventListener("load", getRandomOccupation);
        console.log(getRandomOccupation);
    </script>
</body>
</html>
